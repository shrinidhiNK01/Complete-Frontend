<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Stylesheet Types</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .internal-demo {
      color: #0f766e;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Inline, Internal, and External CSS</h1>
    <p style="color: #dc2626;">This paragraph uses inline CSS.</p>
    <p class="internal-demo">This paragraph uses internal CSS from the style tag.</p>
    <p class="external-demo">This paragraph uses external CSS from styles.css.</p>
    <section class="card">
      <h2>Typography and Colors</h2>
      <p>Use font size, line height, color, and spacing to make content readable.</p>
    </section>
  </main>
</body>
</html>
