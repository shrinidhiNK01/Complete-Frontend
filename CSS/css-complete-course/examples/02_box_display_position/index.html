<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Display Position Units</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="sticky-header">Sticky Header</header>
  <main class="page">
    <h1>Box Model, Display, Position, and Units</h1>
    <section class="box-demo">
      <div class="box">Content + padding + border + margin</div>
    </section>

    <section class="display-demo">
      <span class="inline">Inline</span>
      <span class="inline">Inline</span>
      <div class="block">Block</div>
      <span class="inline-block">Inline Block</span>
      <span class="inline-block">Inline Block</span>
    </section>

    <section class="position-parent">
      <p>Parent with relative position.</p>
      <span class="absolute-badge">Absolute</span>
    </section>
  </main>
</body>
</html>
