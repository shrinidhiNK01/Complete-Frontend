<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transform Gallery</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section class="intro">
      <h1>2D and 3D Transform Gallery</h1>
      <p>Hover each tile to see translate, scale, rotate, skew, and 3D flip effects.</p>
    </section>
    <section class="gallery">
      <article class="tile translate">Translate</article>
      <article class="tile scale">Scale</article>
      <article class="tile rotate">Rotate</article>
      <article class="tile skew">Skew</article>
      <article class="scene">
        <div class="flip">
          <div class="face front">3D Front</div>
          <div class="face back">3D Back</div>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
